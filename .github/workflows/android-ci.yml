name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: |
          gradle test --stacktrace > gradle_test.log 2>&1 || {
            grep -n -E "error:|e: |FAILED|What went wrong|Caused by" gradle_test.log | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace > gradle_build.log 2>&1 || {
            grep -n -E "error:|e: |FAILED|What went wrong|Caused by" gradle_build.log | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrofoto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
